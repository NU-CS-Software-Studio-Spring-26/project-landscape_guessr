# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

AllCops:
  Exclude:
    # protoc-generated stub for Mapbox Vector Tile decoding — do not hand-edit.
    - lib/proto/**/*.rb

